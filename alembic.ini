# Used by the `alembic` CLI; `agent-harness init` configures Alembic programmatically.
[alembic]
script_location = %(here)s/src/agent_harness/adapters/postgres/migrations
# sqlalchemy.url is read from DATABASE_URL in env.py when not set here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
